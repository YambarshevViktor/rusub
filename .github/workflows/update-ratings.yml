name: Update ratings

on:
  schedule:
    - cron: "0 6 * * *"   # каждый день в 06:00 UTC (09:00 МСК)
  workflow_dispatch: {}    # + кнопка "Run workflow" в вкладке Actions на GitHub, чтобы запускать вручную

permissions:
  contents: write

jobs:
  update-ratings:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch ratings from OMDb
        env:
          OMDB_API_KEY: ${{ secrets.OMDB_API_KEY }}
        run: node scripts/update-ratings.mjs

      - name: Commit ratings.json if changed
        run: |
          git config user.name "ratings-bot"
          git config user.email "actions@users.noreply.github.com"
          git add ratings.json
          git diff --staged --quiet || git commit -m "auto: update ratings"
          git push
